<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream EYMRYC - Direction Artistiques</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a14 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            padding: 40px 20px;
            border-bottom: 2px solid #2F5BFF;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #2F5BFF 0%, #FFC857 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 30px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 12px 30px;
            border: 2px solid #2F5BFF;
            background: transparent;
            color: #fff;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #2F5BFF;
            color: #fff;
            box-shadow: 0 0 20px rgba(47, 91, 255, 0.4);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(47, 91, 255, 0.2);
            aspect-ratio: 16/9;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            border-color: #2F5BFF;
            box-shadow: 0 10px 30px rgba(47, 91, 255, 0.3);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .favorite-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #FFC857 0%, #ffb300 100%);
            color: #0a0a14;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 15px rgba(255, 200, 87, 0.4);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            border-radius: 12px;
            overflow: hidden;
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-content img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            max-height: 85vh;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 36px;
            color: #FFC857;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.7);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: #2F5BFF;
            color: #fff;
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 32px;
            color: #FFC857;
            cursor: pointer;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            transition: all 0.3s ease;
            user-select: none;
        }

        .modal-nav:hover {
            background: #2F5BFF;
            color: #fff;
        }

        .modal-prev {
            left: 20px;
        }

        .modal-next {
            right: 20px;
        }

        .modal-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 14px;
            color: #FFC857;
            border: 1px solid #2F5BFF;
        }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 2px solid #2F5BFF;
            color: #aaa;
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #aaa;
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 32px;
            }

            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 12px;
            }

            .modal-nav {
                font-size: 24px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Stream EYMRYC</h1>
            <p class="subtitle">Galerie des Directions Artistiques</p>
            <p style="color: #888; font-size: 13px;">⭐ Les images marquées sont les préférées du créateur</p>
        </header>

        <div class="controls">
            <button class="filter-btn active" onclick="filterGallery('all')">Toutes les images</button>
            <button class="filter-btn" onclick="filterGallery('favorites')">⭐ Préférées uniquement</button>
        </div>

        <div class="gallery" id="gallery"></div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <h3>Aucune image trouvée</h3>
            <p>Essayez une autre filtration</p>
        </div>
    </div>

    <div class="modal" id="modal" onclick="closeModal(event)">
        <div class="modal-content">
            <div class="modal-close" onclick="closeModal()">✕</div>
            <img id="modalImage" src="" alt="">
            <div class="modal-nav modal-prev" onclick="prevImage(event)">❮</div>
            <div class="modal-nav modal-next" onclick="nextImage(event)">❯</div>
            <div class="modal-info"><span id="imageCounter">1</span> / <span id="totalCounter">1</span></div>
        </div>
    </div>

    <footer>
        <p>© 2026 Stream EYMRYC | Direction Artistiques</p>
    </footer>

    <script>

            {url: "https://d2ol7oe51mr4n9.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/7a4c78fd-f032-49a6-9d10-a87a6495561a.png", favorite: false},
            {url: "https://d2ol7oe51mr4n9.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/ab8860da-8c1e-4933-8cc4-97066c77220c.webp", favorite: false},
            {url: "https://d2ol7oe51mr4n9.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/5737e4b3-62f7-4b1b-80a6-c7a22b31f5fd.webp", favorite: false},
            {url: "https://d2ol7oe51mr4n9.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/88f6babb-4e56-4315-8a59-da3438422b5f.png", favorite: false},
            {url: "https://d2ol7oe51mr4n9.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/8daa8153-875a-40f2-a0b6-5e6cef353531.webp", favorite: false},
            {url: "https://d2ol7oe51mr4n9.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/86242c57-0eab-48d1-863f-b147164d7015.png", favorite: false},
        ];

        let currentFilter = 'all';
        let currentModalIndex = 0;

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const emptyState = document.getElementById('emptyState');
            gallery.innerHTML = '';

            const filtered = currentFilter === 'all' 
                ? images 
                : images.filter(img => img.favorite);

            if (filtered.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            filtered.forEach((img, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.onclick = () => openModal(index, filtered);
                
                let html = `<img src="${img.url}" alt="Image ${index + 1}" loading="lazy">`;
                
                if (img.favorite) {
                    html += `<div class="favorite-badge">⭐ Préféré</div>`;
                }
                
                item.innerHTML = html;
                gallery.appendChild(item);
            });

            document.getElementById('totalCounter').textContent = filtered.length;
        }

        function filterGallery(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderGallery();
        }

        function openModal(index, imageList) {
            currentModalIndex = index;
            const modal = document.getElementById('modal');
            const modalImage = document.getElementById('modalImage');
            const imageCounter = document.getElementById('imageCounter');
            
            modalImage.src = imageList[index].url;
            imageCounter.textContent = index + 1;
            document.getElementById('totalCounter').textContent = imageList.length;
            modal.classList.add('active');
        }

        function closeModal(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('modal').classList.remove('active');
        }

        function prevImage(e) {
            e.stopPropagation();
            const filtered = currentFilter === 'all' ? images : images.filter(img => img.favorite);
            currentModalIndex = (currentModalIndex - 1 + filtered.length) % filtered.length;
            openModal(currentModalIndex, filtered);
        }

        function nextImage(e) {
            e.stopPropagation();
            const filtered = currentFilter === 'all' ? images : images.filter(img => img.favorite);
            currentModalIndex = (currentModalIndex + 1) % filtered.length;
            openModal(currentModalIndex, filtered);
        }

        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('modal').classList.contains('active')) return;
            if (e.key === 'ArrowLeft') prevImage({stopPropagation: () => {}});
            if (e.key === 'ArrowRight') nextImage({stopPropagation: () => {}});
            if (e.key === 'Escape') closeModal();
        });

        renderGallery();
    </script>
</body>
</html>
