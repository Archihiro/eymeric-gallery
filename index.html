<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream EYMRYC - Creative Showcase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a14 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            padding: 40px 20px;
            border-bottom: 2px solid #2F5BFF;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #2F5BFF 0%, #FFC857 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            border-bottom: 2px solid rgba(47, 91, 255, 0.2);
            padding-bottom: 20px;
        }

        .tab-btn {
            padding: 12px 30px;
            border: none;
            background: transparent;
            color: #aaa;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }

        .tab-btn:hover {
            color: #2F5BFF;
        }

        .tab-btn.active {
            color: #FFC857;
            background: rgba(47, 91, 255, 0.1);
            border: 2px solid #2F5BFF;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 12px 30px;
            border: 2px solid #2F5BFF;
            background: transparent;
            color: #fff;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #2F5BFF;
            color: #fff;
            box-shadow: 0 0 20px rgba(47, 91, 255, 0.4);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(47, 91, 255, 0.2);
            aspect-ratio: 16/9;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            border-color: #2F5BFF;
            box-shadow: 0 10px 30px rgba(47, 91, 255, 0.3);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .favorite-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #FFC857 0%, #ffb300 100%);
            color: #0a0a14;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 15px rgba(255, 200, 87, 0.4);
        }

        .room-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 20px 15px 15px;
            font-size: 13px;
            font-weight: 600;
            color: #FFC857;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            border-radius: 12px;
            overflow: hidden;
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-content img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            max-height: 85vh;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 36px;
            color: #FFC857;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.7);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: #2F5BFF;
            color: #fff;
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 32px;
            color: #FFC857;
            cursor: pointer;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            transition: all 0.3s ease;
            user-select: none;
        }

        .modal-nav:hover {
            background: #2F5BFF;
            color: #fff;
        }

        .modal-prev {
            left: 20px;
        }

        .modal-next {
            right: 20px;
        }

        .modal-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 14px;
            color: #FFC857;
            border: 1px solid #2F5BFF;
        }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 2px solid #2F5BFF;
            color: #aaa;
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #aaa;
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 32px;
            }

            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 12px;
            }

            .modal-nav {
                font-size: 24px;
                padding: 10px;
            }

            .tab-btn {
                padding: 10px 20px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Stream EYMRYC</h1>
            <p class="subtitle">Creative Showcase</p>
        </header>

        <!-- TABS -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('pixel-art')">🏠 Pixel Art Rooms</button>
            <button class="tab-btn" onclick="switchTab('eymeric')">✨ Eymeric Gallery</button>
        </div>

        <!-- TAB 1: PIXEL ART ROOMS -->
        <div id="pixel-art" class="tab-content active">
            <div class="controls" style="justify-content: center;">
                <p style="color: #aaa; font-size: 14px;">10 Bedroom Variations - Retro Anime Pixel Art</p>
            </div>
            <div class="gallery" id="pixel-gallery"></div>
        </div>

        <!-- TAB 2: EYMERIC GALLERY -->
        <div id="eymeric" class="tab-content">
            <div class="controls">
                <button class="filter-btn active" onclick="filterGallery('all')">Toutes les images</button>
                <button class="filter-btn" onclick="filterGallery('favorites')">⭐ Préférées uniquement</button>
            </div>
            <div class="gallery" id="eymeric-gallery"></div>
            <div id="emptyState" class="empty-state" style="display: none;">
                <h3>Aucune image trouvée</h3>
                <p>Essayez une autre filtration</p>
            </div>
        </div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <h3>Aucune image trouvée</h3>
            <p>Essayez une autre filtration</p>
        </div>
    </div>

    <div class="modal" id="modal" onclick="closeModal(event)">
        <div class="modal-content">
            <div class="modal-close" onclick="closeModal()">✕</div>
            <img id="modalImage" src="" alt="">
            <div class="modal-nav modal-prev" onclick="prevImage(event)">❮</div>
            <div class="modal-nav modal-next" onclick="nextImage(event)">❯</div>
            <div class="modal-info"><span id="imageCounter">1</span> / <span id="totalCounter">1</span></div>
        </div>
    </div>

    <footer>
        <p>© 2026 Stream EYMRYC | Creative Showcase</p>
    </footer>

    <script>
        // PIXEL ART ROOMS DATA
        const pixelArtRooms = [
            {url: "https://d8j0ntlcm91z4.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/hf_20260730_224245_b510de1e-d176-48c4-81c3-edd750bfa91b.png", label: "Studio Loft"},
            {url: "https://d8j0ntlcm91z4.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/hf_20260730_224251_b7a38861-08c6-44f1-8a14-f413ad3d0354.png", label: "Gaming Setup"},
            {url: "https://d8j0ntlcm91z4.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/hf_20260730_224256_f1b6a42e-21a5-4eb9-946c-5e0a40b6b774.png", label: "Bibliothèque"},
            {url: "https://d8j0ntlcm91z4.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/hf_20260730_224301_84a8bbe3-09eb-44fb-901d-c232d3cad27b.png", label: "Artiste Créatif"},
            {url: "https://d8j0ntlcm91z4.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/hf_20260730_224306_188c9267-fe9a-4b90-aafc-c87782b95c98.png", label: "Zen Minimaliste"},
            {url: "https://d8j0ntlcm91z4.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/hf_20260730_224313_fef83552-7c54-4863-a0b4-b6e1207de59f.png", label: "Vintage Collector"},
            {url: "https://d8j0ntlcm91z4.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/hf_20260730_224318_5cd7d066-f9ab-4b1d-9e8b-1a48c904bdc6.png", label: "Mezzanine"},
            {url: "https://d8j0ntlcm91z4.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/hf_20260730_224323_af6df262-93ce-4e2f-af34-8bdc9e4b574c.png", label: "Cinéphile Media"},
            {url: "https://d8j0ntlcm91z4.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/hf_20260730_224328_ce7f9c09-c35a-46aa-b741-e4d785434967.png", label: "Fenêtre Panoramique"},
            {url: "https://d8j0ntlcm91z4.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/hf_20260730_224333_1e7e746c-a819-4e3c-9406-209a70befb63.png", label: "Atelier Workspace"}
        ];

        // EYMERIC GALLERY DATA - 10 images (9 préférées + 1)
        const eymerricImages = [
            {url: "https://d2ol7oe51mr4n9.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/d579c5e8-77dc-4279-a570-6d423d90a8c7.png", favorite: true},
            {url: "https://d2ol7oe51mr4n9.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/6d7fc269-ff9b-4d61-83f4-307d977378e3.webp", favorite: true},
            {url: "https://d2ol7oe51mr4n9.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/ee45fd8f-4a1b-4769-a3a0-c5e3f36dc927.png", favorite: true},
            {url: "https://d2ol7oe51mr4n9.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/5b618010-78d7-4e40-b06f-cb9a8d16dfac.png", favorite: true},
            {url: "https://d2ol7oe51mr4n9.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/b329dbb6-0848-4585-9c01-f95a16da11d9.png", favorite: true},
            {url: "https://d2ol7oe51mr4n9.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/a9356979-4052-47eb-b096-98451721d451.png", favorite: true},
            {url: "https://d2ol7oe51mr4n9.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/d5182e6d-183e-4808-b838-37e21f8e822d.webp", favorite: true},
            {url: "https://d2ol7oe51mr4n9.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/04f50edf-86b5-4066-a995-c1adf01f1a06.png", favorite: true},
            {url: "https://d2ol7oe51mr4n9.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/1c9b0b6c-514d-4014-9a07-ab2372cfd677.png", favorite: true},
            {url: "https://d2ol7oe51mr4n9.cloudfront.net/user_38AbI7eB75blbdegIREzoADNz8Y/e0e47ce4-029c-4ad6-acdb-90fd82e8da14.png", favorite: false},
        ];

        let currentFilter = 'all';
        let currentModalIndex = 0;
        let currentGalleryType = 'pixel-art';

        function switchTab(tab) {
            // Hide all tabs
            document.getElementById('pixel-art').classList.remove('active');
            document.getElementById('eymeric').classList.remove('active');

            // Remove active class from buttons
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            // Show selected tab
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');

            currentGalleryType = tab;

            // Render appropriate gallery
            if (tab === 'pixel-art') {
                renderPixelArtGallery();
            } else {
                renderEymerricGallery();
            }
        }

        function renderPixelArtGallery() {
            const gallery = document.getElementById('pixel-gallery');
            gallery.innerHTML = '';

            pixelArtRooms.forEach((room, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.onclick = () => openModal(index, pixelArtRooms, 'pixel-art');
                
                item.innerHTML = `
                    <img src="${room.url}" alt="${room.label}" loading="lazy">
                    <div class="room-label">${room.label}</div>
                `;
                gallery.appendChild(item);
            });

            document.getElementById('totalCounter').textContent = pixelArtRooms.length;
        }

        function renderEymerricGallery() {
            const gallery = document.getElementById('eymeric-gallery');
            const emptyState = document.getElementById('emptyState');
            gallery.innerHTML = '';

            const filtered = currentFilter === 'all' 
                ? eymerricImages 
                : eymerricImages.filter(img => img.favorite);

            if (filtered.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            filtered.forEach((img, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.onclick = () => openModal(index, filtered, 'eymeric');
                
                let html = `<img src="${img.url}" alt="Image ${index + 1}" loading="lazy">`;
                
                if (img.favorite) {
                    html += `<div class="favorite-badge">⭐ Préféré</div>`;
                }
                
                item.innerHTML = html;
                gallery.appendChild(item);
            });

            document.getElementById('totalCounter').textContent = filtered.length;
        }

        function filterGallery(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderEymerricGallery();
        }

        function openModal(index, imageList, type) {
            currentModalIndex = index;
            const modal = document.getElementById('modal');
            const modalImage = document.getElementById('modalImage');
            const imageCounter = document.getElementById('imageCounter');
            
            modalImage.src = imageList[index].url;
            imageCounter.textContent = index + 1;
            document.getElementById('totalCounter').textContent = imageList.length;
            modal.classList.add('active');
        }

        function closeModal(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('modal').classList.remove('active');
        }

        function prevImage(e) {
            e.stopPropagation();
            const imageList = currentGalleryType === 'pixel-art' 
                ? pixelArtRooms 
                : (currentFilter === 'all' ? eymerricImages : eymerricImages.filter(img => img.favorite));
            currentModalIndex = (currentModalIndex - 1 + imageList.length) % imageList.length;
            openModal(currentModalIndex, imageList, currentGalleryType);
        }

        function nextImage(e) {
            e.stopPropagation();
            const imageList = currentGalleryType === 'pixel-art' 
                ? pixelArtRooms 
                : (currentFilter === 'all' ? eymerricImages : eymerricImages.filter(img => img.favorite));
            currentModalIndex = (currentModalIndex + 1) % imageList.length;
            openModal(currentModalIndex, imageList, currentGalleryType);
        }

        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('modal').classList.contains('active')) return;
            if (e.key === 'ArrowLeft') prevImage({stopPropagation: () => {}});
            if (e.key === 'ArrowRight') nextImage({stopPropagation: () => {}});
            if (e.key === 'Escape') closeModal();
        });

        // Render pixel art on load
        renderPixelArtGallery();
    </script>
</body>
</html>
